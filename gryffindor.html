<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Gryffindor</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>
    
    <main class="container py-4">
        <h1>Gryffindor</h1> 
        <div class="row mb-3 g-2">
            <div class="col-12 col-md-6">
                <input type="search" id="searchInput" class="form-control" placeholder="Search Student" />
            </div>
            <div class="col-12 col-md-4">
                <select id="sortSelect" class="form-select">
                    <option value="firstName-asc">First Name (A–Z)</option>
                    <option value="lastName-asc">Last Name (A–Z)</option>
                    <option value="age-asc">Age (Youngest - Oldest)</option>
                    <option value="year-asc">Year (Youngest - Oldest)</option>
                </select>
            </div>
        </div>
        <div id="rosterGrid" class="row g-3"></div>
            <h5 class="modal-title d-flex align-items-center justify-content-center">
    <button class="back-home-btn" onclick="location.href='index.html'">Back to Home</button>
</h5>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->

    <script src="js/students.js"></script>
